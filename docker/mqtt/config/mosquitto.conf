# Broker logs go to stdout so Docker's json-file rotation owns them
log_dest stdout
persistence false

# Each listener has its own auth settings (must precede the listeners)
per_listener_settings true

# Main listener — all RV services authenticate with MQTT_USER/MQTT_PASS
# (credentials in docker/.env, hashes in mosquitto.passwd — both gitignored)
listener 1883
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd

# Websocket listener for the browser dashboard: anonymous but read-only
# (websocket.acl) so clients on RV WiFi cannot publish commands or spoof data
# The anonymous listener binds the RV LAN and loopback ONLY, so it is not
# listening on the uplink at all. It used to bind 0.0.0.0, leaving the host
# firewall as the single thing between an anonymous reader and a campground
# network -- and that firewall silently de-armed for two days on 2026-10-21,
# so "the firewall will catch it" is not worth resting on by itself.
#
# Two blocks because per_listener_settings is true, so each listener carries
# its own settings. Loopback matters as well as br0: the dashboard is
# sometimes reached through an SSH tunnel, where the browser's hostname is
# localhost.
#
# 1883 is deliberately left on 0.0.0.0. It already requires a password, and
# binding it to br0 would make the broker refuse to start if br0 were not up
# yet -- on an unattended RV that trades a small exposure for the risk of no
# MQTT at all, which means no alarm commands and no telemetry.
listener 9001 127.0.0.1
protocol websockets
allow_anonymous true
acl_file /mosquitto/config/websocket.acl

listener 9001 10.0.0.1
protocol websockets
allow_anonymous true
acl_file /mosquitto/config/websocket.acl
