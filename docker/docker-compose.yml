# =================================================================
# RV Docker stack
#
# All paths are relative to this file (rv/docker/), so the stack runs
# from any checkout. The one external repo (fork of linuxkidd/rvc-monitor-py)
# can be relocated via RVC_MONITOR_DIR in .env; run ./setup-rvc-monitor.sh
# to clone it / verify it is at the pinned commit before building rvc2mqtt.
#
# Optional services use compose profiles instead of comment blocks:
#   docker compose --profile raspap up -d     # RASPAp access point
#   docker compose --profile bleak up -d      # legacy bleak battery monitor
# Credentials live in .env (gitignored); see .env.example.
# =================================================================

# Container logs go to the host's journald (routed to RAM -- see
# ../sdcard-writes/) instead of json-file, so they no longer write to the
# SD card on every log line. journald's own volatile-buffer config caps
# total size and retention (36h), not this driver.
x-logging: &logging
  driver: "journald"

services:

  # MQTT Broker (required - everything depends on it)
  mqtt:
    container_name: mqtt
    network_mode: host
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging
    environment:
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
    # autoheal (see below) restarts this when Docker marks it unhealthy.
    # Without this label autoheal ignores the healthcheck entirely --
    # 'restart: unless-stopped' only acts on exit, never on unhealthy.
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -u \"$$MQTT_USER\" -P \"$$MQTT_PASS\" -t health/probe -m 1 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/data:/mosquitto/data

  # CAN Bus RV-C Monitoring
  rvc2mqtt:
    build:
      context: ${RVC_MONITOR_DIR:-../../../linuxkidd/rvc-monitor-py}
      dockerfile: Dockerfile
    container_name: rvc2mqtt
    network_mode: host
    image: rvc2mqtt:latest
    restart: unless-stopped
    # Python as PID 1 ignores SIGTERM; tini forwards it so stops are fast
    init: true
    mem_limit: 128m
    logging: *logging
    # DEBUG_LEVEL=5 writes every CAN frame to disk — leave at 0 to avoid flash wear
    environment:
      - DEBUG_LEVEL=0
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
    # autoheal (below) restarts this container when Docker marks it unhealthy
    labels:
      - autoheal=true
    volumes:
      - ./can-healthcheck.py:/healthcheck/check.py:ro
    healthcheck:
      # fails only when the CAN bus has gone silent (process alive, no RVC
      # traffic) -- see can-healthcheck.py for why other errors exit 0
      test: ["CMD", "python3", "/healthcheck/check.py"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s
    depends_on:
      mqtt:
        condition: service_healthy

  # Bluetooth Battery Monitoring (gatttool implementation)
  battery:
    build:
      context: ../bat2mqtt
      dockerfile: Dockerfile
    container_name: battery
    image: battery:latest
    network_mode: host
    restart: unless-stopped
    init: true
    mem_limit: 128m
    logging: *logging
    volumes:
      - /run/dbus:/run/dbus:ro
      - /sys/class/bluetooth:/sys/class/bluetooth:ro
      - /sys/devices:/sys/devices:ro
    devices:
      - /dev/bus/usb:/dev/bus/usb
    # De-privileged: gatttool/hciconfig need NET_ADMIN/NET_RAW for HCI
    # sockets; SYS_ADMIN kept for BlueZ adapter resets
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    environment:
      - DEBUG_LEVEL=0
      - MQTT_HOST=localhost
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      # Which of the three BT adapters to use, by its own BD address: the
      # Edimax dongle. hciN renumbers whenever the dongles re-enumerate (seen
      # hci1 -> hci2 -> hci1 on 2026-10-19), so the MAC is the stable handle.
      # Was a hardcoded default in bat2mqtt.py; here it survives a dongle swap
      # without editing and rebuilding the image.
      - BT_ADAPTER_MAC=08:BE:AC:35:8E:5E
      # The battery monitor itself (the BLE peripheral we connect to).
      - BAT_DEV_MAC=F8:33:31:56:ED:16
    # gatttool can stay alive and simply stop notifying, which froze this
    # service twice in two days with no error at all. The process now exits on
    # its own after BAT_STALE_EXIT so restart: unless-stopped recovers it; this
    # healthcheck is what makes the failure *visible* (docker ps, dashboard).
    # Note Docker does not restart an unhealthy container -- the exit does.
    # autoheal (see below) restarts this when Docker marks it unhealthy.
    # Without this label autoheal ignores the healthcheck entirely --
    # 'restart: unless-stopped' only acts on exit, never on unhealthy.
    labels:
      - autoheal=true
    healthcheck:
      # A missing file counts as unhealthy: it means nothing has been
      # published yet, which is a real failure, not a warm-up.
      test: ["CMD-SHELL", "python3 -c \"import os,sys,time; p='/tmp/bat2mqtt.alive'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 180 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on:
      mqtt:
        condition: service_healthy

  # Legacy bleak-based battery monitor (enable with --profile bleak)
  battery_bleak:
    profiles: ["bleak"]
    build:
      context: ../bat2mqtt
      dockerfile: Dockerfile-bleak
    container_name: battery_bleak
    image: battery:bleak
    network_mode: host
    restart: unless-stopped
    init: true
    mem_limit: 128m
    logging: *logging
    volumes:
      - /run/dbus:/run/dbus:rw
      - /var/run/dbus:/var/run/dbus:rw
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    environment:
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/dbus/system_bus_socket
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
    depends_on:
      mqtt:
        condition: service_healthy

  # TireLinc TPMS Monitoring (Bluetooth GATT via USB dongle)
  tirelinc:
    build:
      context: ../tirelinc
      dockerfile: Dockerfile
    container_name: tirelinc
    image: tirelinc:latest
    network_mode: host
    restart: unless-stopped
    init: true
    mem_limit: 128m
    logging: *logging
    depends_on:
      mqtt:
        condition: service_healthy
    volumes:
      - /run/dbus:/run/dbus:rw
      - /var/run/dbus:/var/run/dbus:rw
      - /sys/class/bluetooth:/sys/class/bluetooth:ro
      - /sys/devices:/sys/devices:ro
    devices:
      - /dev/bus/usb:/dev/bus/usb
    # De-privileged: bleak talks to host bluetoothd over D-Bus, no raw
    # device access needed beyond the mounts above
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      # The BT500 dongle, by BD address -- deliberately a different adapter
      # from the battery monitor's, so two GATT sessions never share one.
      - BT_ADAPTER_MAC=C8:7F:54:97:71:1B
      # The TireLinc repeater (the BLE peripheral we connect to).
      - TIRELINC_MAC=F4:CF:A2:85:D0:62
    # Tires can legitimately be quiet for a few minutes, so the window is much
    # wider than the battery's. TIRE_STALE_MINUTES (15) still warns over MQTT;
    # TIRE_STALE_EXIT_MINUTES (45) exits so Docker restarts us.
    # autoheal (see below) restarts this when Docker marks it unhealthy.
    # Without this label autoheal ignores the healthcheck entirely --
    # 'restart: unless-stopped' only acts on exit, never on unhealthy.
    labels:
      - autoheal=true
    healthcheck:
      # A missing file counts as unhealthy: it means nothing has been
      # published yet, which is a real failure, not a warm-up.
      test: ["CMD-SHELL", "python3 -c \"import os,sys,time; p='/tmp/tirelinc.alive'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 1800 else 1)\""]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 180s

  # Victron Solar Monitoring (ve.direct)
  solar:
    build:
      context: ../ve.direct
      dockerfile: Dockerfile
    container_name: solar
    image: solar:latest
    network_mode: host
    restart: unless-stopped
    init: true
    mem_limit: 128m
    logging: *logging
    devices:
      - /dev/ttyAMA0:/dev/ttyAMA0
    privileged: false
    environment:
      - HEALTHCHECK_TOPICS=RVC/SOLAR_CONTROLLER_STATUS/1
      - HEALTHCHECK_WINDOW=45
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - PYTHONUNBUFFERED=1
    depends_on:
      mqtt:
        condition: service_healthy

  # GPIO Alarm System
    # autoheal (see below) restarts this when Docker marks it unhealthy.
    labels:
      - autoheal=true
    volumes:
      - ./mqtt-freshness-healthcheck.py:/healthcheck/freshness.py:ro
    healthcheck:
      # Fails only when this container is alive but has stopped publishing --
      # the wedge a process-alive check cannot see. Any other fault exits 0
      # ("can't tell"), so an unrelated problem cannot restart-loop it.
      test: ["CMD", "python3", "/healthcheck/freshness.py"]
      interval: 120s
      timeout: 25s
      retries: 3
      start_period: 120s
  alarm:
    build:
      context: ../alarm
      dockerfile: Dockerfile
    container_name: alarm
    network_mode: host
    restart: unless-stopped
    init: true
    mem_limit: 128m
    logging: *logging
    image: alarm:latest
    # De-privileged: gpiozero/lgpio only needs the GPIO character device.
    # gpiozero.LGPIOFactory auto-detects the Pi revision and opens chip 4
    # for Pi 5 boards (not 0) -- container-side path must stay gpiochip4.
    # Host chip number drifts across reboots/kernel updates (seen as 4, 0,
    # 15) -- bind to the stable udev symlink, not a raw gpiochipN path.
    devices:
      - /dev/gpiochip-rp1:/dev/gpiochip4
    environment:
      - HEALTHCHECK_TOPICS=rv/alarm/heartbeat
      - HEALTHCHECK_WINDOW=75
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - PYTHONUNBUFFERED=1
    depends_on:
      mqtt:
        condition: service_healthy

  # Web Dashboard Interface
    volumes:
      - ./mqtt-freshness-healthcheck.py:/healthcheck/freshness.py:ro
    # autoheal (see below) restarts this when Docker marks it unhealthy.
    labels:
      - autoheal=true
    healthcheck:
      # The alarm publishes rv/alarm/heartbeat every 30s from inside its main
      # loop (see HEARTBEAT_INTERVAL in alarm/alarm.py), so silence means the
      # loop has stopped -- not merely that nothing has changed. Before that
      # heartbeat existed this container could not be checked at all, because
      # its status topics move only on change and a freshness check would have
      # restarted a perfectly healthy alarm.
      #
      # 75s window is more than two heartbeat intervals, so a single missed
      # publish cannot restart the alarm.
      test: ["CMD", "python3", "/healthcheck/freshness.py"]
      interval: 120s
      timeout: 90s
      retries: 3
      start_period: 90s
  webserver:
    build:
      context: ../webserver
      dockerfile: Dockerfile
      additional_contexts:
        rv: ..
    container_name: webserver
    image: webserver:latest
    network_mode: host
    restart: unless-stopped
    init: true
    mem_limit: 512m
    logging: *logging
    # DE-PRIVILEGED 2026-10-28. pid:host, privileged:true and the docker.sock
    # mount were the webserver's three independent routes to host root, there
    # only to run a fixed set of host operations (firewall reads, container
    # restart/state, reboot, three host files). Those now go through sophie-hostd
    # on 127.0.0.1 (rv/sophie-hostd; cutover done and verified across a reboot and
    # a cold boot 2026-10-28, see plan_history.md §7). The container keeps network_mode: host (loopback still
    # reaches the host daemons; it reads host NICs) and its GPIO device -- all it
    # needs now. The last privileged path -- the modem rebind + MTP kill in
    # prepare_cellular_modem() -- moved to sophie-hostd 2026-10-28, so
    # /sys/bus/usb is no longer mounted and the webserver has NO route to host
    # root left. It still reads USB via /dev/bus/usb (lsusb) and ModemManager
    # via D-Bus, neither of which needs privilege.
    # No cap_add: the webserver needs no extra capabilities now that it is
    # de-privileged. It previously had privileged:true (every capability); when
    # that came off nothing had to replace it. If a capability is ever proven
    # necessary, add exactly that one -- never privileged:true back.
    environment:
      - TZ=America/Los_Angeles
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - PYTHONUNBUFFERED=1
      - KASA_DISCOVERY_TIMEOUT=10
      - KASA_DEFAULT_TIMEOUT=10
      - DISABLE_KASA=false
      - KASA_IP=${KASA_IP}
      - KASA_USERNAME=${KASA_USERNAME}
      - KASA_PASSWORD=${KASA_PASSWORD}
      - LC_ALL=C.UTF-8
      - LANG=C.UTF-8
      # Which rpzero_wifi_api.py is live: 127.0.0.1 = this host's own
      # wifi-api-rp5.service driving the Alfa adapter (wlan1); 10.10.0.1 = the
      # Pi Zero 2W bridge over USB. This container is network_mode: host, so
      # loopback reaches the host service. Port 12346 either way.
      - WIFI_BRIDGE_HOST=127.0.0.1
      - WIFI_BRIDGE_API_PORT=12346
      # usbhub-api.service on the host: per-port power for the Plugable hub.
      # This container cannot do it itself -- /sys/devices is mounted read-only
      # here, so writing a port attribute fails with EACCES even privileged.
      - USBHUB_API_HOST=127.0.0.1
      - USBHUB_API_PORT=12347
      - COMPOSE_FILE=/home/tblank/code/tblank1024/rv/docker/docker-compose.yml
    volumes:
      # REMOVED 2026-10-27: - /dev:/host-dev:rw
      #
      # A live, writable devtmpfs. /host-dev/mmcblk0 is the SD card as a block
      # device, so write access to it rewrites the root filesystem directly,
      # bypassing file ownership and permissions entirely -- one of three
      # independent routes from a webserver bug to root on the host.
      #
      # Nothing used it. Grepped the whole repo: "host-dev" appeared only in
      # this file, on the mount line and in one comment referring to it. The
      # original reason (a re-enumerated device is only visible through a live
      # bind of devtmpfs) no longer applies, because the jobs that needed
      # hotplugged devices were delegated to host daemons: usbhub-api owns hub
      # power, wifi-api-rp5 owns the Alfa, and the modem rebind now goes through
      # sophie-hostd. Restore it only with a specific device in mind, and
      # read-only if at all.
      - /sys/class/net:/sys/class/net:ro
      - /sys/devices:/sys/devices:ro
      - /dev/bus/usb:/dev/bus/usb:rw
      - /run/dbus:/run/dbus:rw
      - /var/run/dbus:/var/run/dbus:rw
      - ../alarm:/home/tblank/code/tblank1024/rv/alarm:ro
      # docker.sock removed 2026-10-28 (de-privileging): container restart and
      # state go through sophie-hostd, which holds the socket on the host.
      - .:/home/tblank/code/tblank1024/rv/docker:ro
      - ../webserver/server/synology-password.json:/app/rvsecurity/server/synology-password.json:ro
    # gpiochip: stable udev symlink, not a raw gpiochipN path (host chip
    # number drifts across reboots/kernel updates -- seen as 4, 0, 15).
    # Container-side path must stay gpiochip4: gpiozero.LGPIOFactory
    # auto-detects the Pi revision and opens chip 4 for Pi 5 boards.
    # Because this service is privileged, Docker silently skips a devices:
    # entry whose host path is missing -- so a typo here fails quietly rather
    # than refusing to start. (This used to add "other host devices are
    # reached via /host-dev instead"; that bind was removed 2026-10-27, see
    # the note in volumes: above.)
    devices:
      - /dev/gpiochip-rp1:/dev/gpiochip4
    # autoheal (see below) restarts this when Docker marks it unhealthy.
    # Without this label autoheal ignores the healthcheck entirely --
    # 'restart: unless-stopped' only acts on exit, never on unhealthy.
    labels:
      - autoheal=true
    healthcheck:
      # Port 8000 is the FastAPI server; port 80 is RASPAp's native GUI,
      # which answers 302 to everything and made this check pass vacuously
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      mqtt:
        condition: service_healthy
      rvc2mqtt:
        condition: service_started

  # Data Watcher/Logger
  watcher:
    build:
      context: ../watcher
      dockerfile: Dockerfile
    container_name: watcher
    network_mode: host
    restart: unless-stopped
    init: true
    mem_limit: 128m
    logging: *logging
    image: watcher:latest
    privileged: false
    environment:
      - HEALTHCHECK_TOPICS=RVC/SYS_ERRORS,RVC/RV_Watcher/1
      - HEALTHCHECK_WINDOW=20
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - PYTHONUNBUFFERED=1
    depends_on:
      mqtt:
        condition: service_healthy
    volumes:
      - ./mqtt-freshness-healthcheck.py:/healthcheck/freshness.py:ro
      - ./watcherlogs:/app/watcher/watcherlogs

  # Autoheal — watches containers labeled autoheal=true and restarts them
  # when Docker reports them unhealthy (see rvc2mqtt's healthcheck above).
  # Only touches containers carrying that label, so it won't act on mqtt/
  # webserver's own healthchecks.
    # autoheal (see below) restarts this when Docker marks it unhealthy.
    labels:
      - autoheal=true
    healthcheck:
      # Fails only when this container is alive but has stopped publishing --
      # the wedge a process-alive check cannot see. Any other fault exits 0
      # ("can't tell"), so an unrelated problem cannot restart-loop it.
      test: ["CMD", "python3", "/healthcheck/freshness.py"]
      interval: 60s
      timeout: 25s
      retries: 3
      start_period: 90s
  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    mem_limit: 32m
    logging: *logging
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=90
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # RASPAp access point (enable with --profile raspap; runs natively today)
  raspap:
    profiles: ["raspap"]
    container_name: raspap
    image: ghcr.io/raspap/raspap-docker:latest
    ports:
      - "8081:8081"
    privileged: true
    network_mode: host
    cgroup: host  # required on ARM devices
    restart: unless-stopped
    logging: *logging
    environment:
      - RASPAP_SSID=${RASPAP_SSID}
      - RASPAP_SSID_PASS=${RASPAP_SSID_PASS}
      - RASPAP_COUNTRY=GB
      - RASPAP_WEBGUI_USER=${RASPAP_WEBGUI_USER}
      - RASPAP_WEBGUI_PASS=${RASPAP_WEBGUI_PASS}
      - RASPAP_WEBGUI_PORT=80
    cap_add:
      - SYS_ADMIN
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
