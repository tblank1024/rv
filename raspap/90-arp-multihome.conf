# Sophie: ARP behaviour for a multi-homed host.  Installed to /etc/sysctl.d/.
#
# eth1 (USB ethernet) and wlan1 (Alfa AWUS036ACM) can hold addresses on the SAME
# subnet at the same time -- routinely at home, where the Realtek sits in the
# house LAN and the Alfa is associated to the house WiFi, both on 192.168.2.0/24.
#
# With the kernel defaults (arp_ignore=0, arp_announce=0) either NIC answers ARP
# for either address, so which interface actually carries traffic to a given
# address is nondeterministic -- "ARP flux".  Two consequences we hit:
#
#   1. A per-interface port scan tests whichever NIC happened to answer, not the
#      one you aimed at.  On 2026-10-23 all 127 probes aimed at wlan1's address
#      arrived on eth1, which left the firewall verification ambiguous.
#   2. pi5connect's probe_iface() uses ping -I / curl --interface, i.e.
#      SO_BINDTODEVICE, which filters INBOUND packets by arrival device as well.
#      If the gateway has the candidate's address cached against the other NIC's
#      MAC, the reply lands on the wrong device and the bound socket discards it,
#      so a healthy uplink can be rejected as dead.
#
# arp_ignore=1    reply only if the target address is on the arrival interface.
# arp_announce=2  use an address from the outgoing interface as the sender IP.
#
# The effective value is max(conf.all, conf.<iface>), so setting "all" covers
# every interface present and future.  That matters here: the USB uplink switch
# means interface names come and go, and a per-interface entry in this directory
# silently fails to apply when that NIC isn't enumerated at boot.
#
# Harmless for br0, docker0 and br-*: each is the sole owner of its subnet, where
# arp_ignore=1 behaves identically to 0 and arp_announce=2 picks the same address.
#
# Trade-off accepted: wlan1's address stops being reachable when the Alfa is
# down, rather than being silently covered by eth1.  Nothing depends on that
# address -- the Pi is reached at eth1's address or at 10.0.0.1.
#
# Applied live and verified by external scan 2026-10-23 (SYN logged IN=wlan1).
# Background: plan_history.md §4, firewall/README.md.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
