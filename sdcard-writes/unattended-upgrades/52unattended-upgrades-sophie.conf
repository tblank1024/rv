// Installed by sdcard-writes/unattended-upgrades/install.sh on Sophie.
// Numbered 52 so it loads AFTER the stock 50unattended-upgrades and wins.
//
// Design for an UNATTENDED RV that is often offline or on metered cellular:
//   - SECURITY updates only. No feature/point-release churn, and nothing from
//     the Raspberry Pi firmware repo -- kernel/firmware changes on this box are
//     deliberate, not automatic (a bad auto kernel update on a headless RV with
//     nobody there is the exact failure to avoid).
//   - NEVER reboot on its own. A reboot unattended could strand the RV with no
//     uplink (pi5connect/wan_scan run at boot) or mid-task. Reboots stay manual.
//   - No mail (no MTA on this host); outcomes are in the unattended-upgrades log.

Unattended-Upgrade::Origins-Pattern {
    // Codename-based, so it keeps matching after bookworm goes from "stable"
    // to "oldstable" -- the suite alias a=bookworm-security would not.
    "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
};

// The one choice that matters most on an unattended RV.
Unattended-Upgrade::Automatic-Reboot "false";

// Conservative: do not let an automatic run remove packages.
Unattended-Upgrade::Remove-Unused-Kernel-Packages "false";
Unattended-Upgrade::Remove-New-Unused-Dependencies "false";
Unattended-Upgrade::Remove-Unused-Dependencies "false";

// If a config file in a package changed, keep the installed version rather
// than prompting (there is no one to answer) or overwriting local edits.
Unattended-Upgrade::MinimalSteps "true";
Dpkg::Options {
    "--force-confdef";
    "--force-confold";
};
